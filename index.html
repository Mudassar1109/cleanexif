          {"@type":"Question","name":"Does removing metadata affect image quality?","acceptedAnswer":{"@type":"Answer","text":"PNG output is re-encoded losslessly. JPEG and WebP are re-encoded with a high quality setting, so a small quality or file-size difference may occur."}}
